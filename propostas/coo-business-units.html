<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head>
<body>
<title>COO Business Units</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: tela única — cabeçalho do VBM Performance Hub, barra de filtros
   em cascata e dois painéis lado a lado (Production 3×3 | Financial 2×3),
   como no print COO – Business Units. */
:root {
  /* Página (muda com o tema) */
  --page-base: #eef2f7;
  --page-bg:
    radial-gradient(1100px 620px at 8% -8%, rgba(60,181,229,.14), transparent 62%),
    radial-gradient(900px 560px at 104% 108%, rgba(26,139,191,.10), transparent 60%),
    linear-gradient(135deg, #f5f8fc 0%, #edf2f8 55%, #e2eaf3 100%);
  --text: #0F172A;
  --text-soft: #4B5563;
  --line: rgba(15,23,42,.12);
  --ctl-bg: #FFFFFF;
  --ctl-border: rgba(13,38,64,.16);
  --ctl-text: #1F2937;
  --ctl-on-bg: #0B6E99;
  --ctl-on-text: #FFFFFF;
  --banner-bg: #FFFBEB;
  --banner-border: #F59E0B;
  --banner-text: #92400E;
  --focus: #0B6E99;

  /* Cabeçalho (igual nos dois temas, como no Performance Hub) */
  --nav-bg: linear-gradient(135deg, #041523 0%, #072842 55%, #0b3a64 100%);
  --nav-text: rgba(255,255,255,.88);
  --nav-accent: #3CB5E5;

  /* Card de gráfico (off-white nos dois temas, como no Performance Hub) */
  --card: #F6F6F6;
  --card-border: #E2E8F0;
  --card-shadow: 0 12px 40px rgba(10,20,35,.12), 0 2px 8px rgba(10,20,35,.06);
  --card-title: #316866;
  --card-unit: #4B5563;
  --ink-strong: #0F172A;
  --ink-soft: #6B7280;
  --serie-b: #BCBEC0;
  --serie-a: #3CB5E5;
  --good: #007E7A;
  --bad: #DC2626;
  --bad-text: #B91C1C;
  --flat: #747678;

  --font-ui: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --font-chart: 'Vale Sans', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-title: 'Vale Sans Medium', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page-base: #02101c;
    --page-bg:
      radial-gradient(1100px 620px at 8% -8%, rgba(60,181,229,.16), transparent 62%),
      radial-gradient(900px 560px at 104% 108%, rgba(26,139,191,.14), transparent 60%),
      linear-gradient(135deg, #041523 0%, #072842 55%, #0b3a64 100%);
    --text: #F4F7FB;
    --text-soft: rgba(244,247,251,.68);
    --line: rgba(255,255,255,.12);
    --ctl-bg: rgba(255,255,255,.06);
    --ctl-border: rgba(255,255,255,.16);
    --ctl-text: #E5EDF5;
    --ctl-on-bg: #3CB5E5;
    --ctl-on-text: #02101c;
    --banner-bg: rgba(245,158,11,.10);
    --banner-border: rgba(245,158,11,.55);
    --banner-text: #FCD34D;
    --focus: #7dd3f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page-base: #02101c;
  --page-bg:
    radial-gradient(1100px 620px at 8% -8%, rgba(60,181,229,.16), transparent 62%),
    radial-gradient(900px 560px at 104% 108%, rgba(26,139,191,.14), transparent 60%),
    linear-gradient(135deg, #041523 0%, #072842 55%, #0b3a64 100%);
  --text: #F4F7FB;
  --text-soft: rgba(244,247,251,.68);
  --line: rgba(255,255,255,.12);
  --ctl-bg: rgba(255,255,255,.06);
  --ctl-border: rgba(255,255,255,.16);
  --ctl-text: #E5EDF5;
  --ctl-on-bg: #3CB5E5;
  --ctl-on-text: #02101c;
  --banner-bg: rgba(245,158,11,.10);
  --banner-border: rgba(245,158,11,.55);
  --banner-text: #FCD34D;
  --focus: #7dd3f0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html {
  min-height: 100%;
  background-color: var(--page-base);
  background-image: var(--page-bg);
  background-attachment: fixed;
}
body {
  margin: 0;
  background: var(--page-base);
  background-image: var(--page-bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 110; background: #041523;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ── Cabeçalho (topnav do Performance Hub) ── */
.topnav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100;
  min-height: 64px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--nav-bg);
  border-bottom: 1px solid rgba(255,255,255,.05);
  box-shadow: 0 2px 20px rgba(13,38,64,.18);
}
.topnav-logo { display: flex; align-items: center; }
.topnav-logo svg { height: 26px; width: auto; display: block; }
.topnav-brand {
  margin: 0; font-weight: 300; font-size: 1.05rem; letter-spacing: .08em; color: var(--nav-text);
  position: relative; padding-bottom: 6px; white-space: nowrap;
}
.topnav-brand::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, rgba(60,181,229,.15), var(--nav-accent), rgba(60,181,229,.15));
}
.topnav-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.nav-btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 6px 16px;
  border-radius: 999px; border: 1px solid rgba(125,211,240,.45); background: rgba(255,255,255,.04);
  color: #fff; font: 500 .78rem var(--font-ui); cursor: pointer; white-space: nowrap;
}
.nav-btn:hover { background: rgba(60,181,229,.16); }
.nav-icon {
  width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%;
  border: 0; background: transparent; color: #fff; cursor: pointer;
}
.nav-icon:hover { background: rgba(255,255,255,.08); }


/* ── Tela única: cabeçalho + barra de filtros + dois painéis que ocupam o resto ── */
html, body { height: 100%; }
body { display: flex; flex-direction: column; min-height: 0; }
.topnav { flex-shrink: 0; }
.page {
  flex: 1 1 auto; min-height: 0; width: 100%;
  padding-block: 10px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px;
}

/* Barra superior: unidade/período + filtros + legenda, numa faixa compacta */
.bar {
  flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 18px;
  padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--ctl-bg) 60%, transparent);
}
.bar-title { display: flex; flex-direction: column; gap: 2px; min-width: 0; margin-right: 6px; }
.bar-title .eyebrow { margin: 0; font-size: .62rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--text-soft); }
.bar-title h2 { margin: 0; font: 500 1.15rem/1.2 var(--font-ui); white-space: nowrap; }
.bar-title h2 span { color: var(--text-soft); font-weight: 400; }
.filter { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.filter-label { font-size: .6rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-soft); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 2px; border-radius: 9px; border: 1px solid var(--ctl-border); background: var(--ctl-bg); }
.seg button {
  min-height: 26px; padding: 2px 10px; border: 0; border-radius: 7px; background: transparent;
  color: var(--ctl-text); font: 500 .74rem var(--font-ui); cursor: pointer; white-space: nowrap;
}
.seg button:hover { background: color-mix(in srgb, var(--ctl-on-bg) 12%, transparent); }
.seg button[aria-pressed="true"] { background: var(--ctl-on-bg); color: var(--ctl-on-text); }
.bar .spacer { flex: 1 1 0; }
.bar-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.legend { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 14px; margin: 0; padding: 0; list-style: none; font-size: .72rem; color: var(--text-soft); }
.legend li { display: flex; align-items: center; gap: 6px; }
.swatch { width: 12px; height: 9px; border-radius: 2px; }
.updated { margin: 0; font-size: .68rem; color: var(--text-soft); font-variant-numeric: tabular-nums; }
.demo { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--banner-border); background: var(--banner-bg); color: var(--banner-text); font-size: .66rem; font-weight: 500; }

/* Painéis (Production Drivers | Financial Drivers) */
.dash { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; }
.panel {
  min-height: 0; display: flex; flex-direction: column; gap: 6px;
  background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; box-shadow: var(--card-shadow);
  padding: 10px 12px 8px; color: var(--ink-strong);
}
.panel-title { margin: 0; flex-shrink: 0; font: italic 400 1rem var(--font-title); color: #374151; }
.panel-grid { flex: 1 1 auto; min-height: 0; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 6px 14px; }
.panel-prod .panel-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.panel-fin .panel-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* Gráfico (chart-container do Performance Hub, sem moldura própria dentro do painel) */
.card { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.card-head { flex-shrink: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card-title { margin: 0; font: 400 .95rem/1.2 var(--font-title); color: var(--card-title); letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-unit { margin: 0; font: 400 .72rem var(--font-chart); color: var(--card-unit); }
.card .seg { border-color: rgba(13,38,64,.16); background: #fff; }
.card .seg button { color: #1F2937; min-height: 22px; padding: 1px 8px; font-size: .68rem; }
.card .seg button[aria-pressed="true"] { background: #0B6E99; color: #fff; }
.card .seg button:hover:not([aria-pressed="true"]) { background: #EEF6FB; }
.chart { flex: 1 1 auto; min-height: 90px; position: relative; }
.chart svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; overflow: visible; font-family: var(--font-chart); }

/* SVG: barras e cota de diferença */
.b-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .9s cubic-bezier(.16,.84,.28,1) both; }
.b-bar.neg { transform-origin: 50% 0%; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.b-val { fill: var(--ink-strong); font-size: 11px; font-variant-numeric: tabular-nums; }
.b-axis { fill: var(--ink-soft); font-size: 10px; }
.b-sep { stroke: rgba(15,23,42,.08); }
.b-base { stroke: #CBD5E1; }
.cota { animation: fade .5s .6s ease-out both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.is-static .b-bar, .is-static .cota { animation: none; }
.d-ref { stroke: rgba(116,118,120,.45); stroke-dasharray: 3 2; }
.d-now { stroke: rgba(116,118,120,.45); }
.d-track { stroke: rgba(116,118,120,.30); }
.d-pill { fill: rgba(255,255,255,.94); stroke: rgba(15,23,42,.06); }
.d-txt { font-size: 10px; font-variant-numeric: tabular-nums; }
.is-good .d-span { stroke: rgba(0,126,122,.6); } .is-good .d-txt { fill: var(--good); } .is-good .d-up { fill: rgba(0,126,122,.14); }
.is-bad  .d-span { stroke: rgba(220,38,38,.6); } .is-bad  .d-txt { fill: var(--bad-text); } .is-bad  .d-up { fill: rgba(220,38,38,.12); }
.is-flat .d-span { stroke: rgba(116,118,120,.6); } .is-flat .d-txt { fill: #555; } .is-flat .d-up { fill: rgba(116,118,120,.12); }
.is-good .d-dn { fill: url(#hatch-good); } .is-bad .d-dn { fill: url(#hatch-bad); } .is-flat .d-dn { fill: url(#hatch-flat); }

/* Composição do All-in */
.mini-table-wrap { flex-shrink: 0; overflow-x: auto; }
.mini-table { width: 100%; border-collapse: collapse; font: 400 .68rem var(--font-chart); font-variant-numeric: tabular-nums; color: #1F2937; }
.mini-table th, .mini-table td { padding: 2px 5px; text-align: right; white-space: nowrap; }
.mini-table th:first-child, .mini-table td:first-child { text-align: left; }
.mini-table thead th { font-weight: 600; color: #fff; background: #0B6E99; }
.mini-table thead th:first-child { border-radius: 5px 0 0 5px; }
.mini-table thead th:last-child { border-radius: 0 5px 5px 0; }
.mini-table tbody tr + tr td { border-top: 1px solid #E5E7EB; }
.mini-table tfoot td { font-weight: 600; border-top: 1px solid #94A3B8; }
.mini-table .b { color: #6B7280; }

.tip {
  position: fixed; z-index: 200; pointer-events: none; padding: 6px 10px; border-radius: 8px;
  background: #0B3A50; color: #fff; font: 500 .74rem var(--font-ui); box-shadow: 0 6px 18px rgba(15,23,42,.25);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}

/* Telas menores: a tela única vira rolagem, com altura fixa por gráfico */
@media (max-width: 1100px), (max-height: 640px) {
  html, body { height: auto; }
  body { display: block; }
  .dash { grid-template-columns: minmax(0, 1fr); }
  .panel-grid { grid-template-rows: none; grid-auto-rows: 230px; }
  .panel-fin .panel-grid .card-allin { grid-row: span 2; }
}
@media (max-width: 720px) {
  .panel-prod .panel-grid, .panel-fin .panel-grid { grid-template-columns: minmax(0, 1fr); }
  .topnav { grid-template-columns: auto 1fr auto; }
  .topnav-brand { font-size: .82rem; justify-self: center; }
  .nav-btn .lbl { display: none; }
  .nav-btn { padding: 6px 10px; }
  .bar .spacer { display: none; }
  .bar-meta { align-items: flex-start; }
  .legend { justify-content: flex-start; }
}
@media (max-width: 420px) { .topnav-brand { display: none; } }
@media (prefers-reduced-motion: reduce) { .b-bar, .cota { animation: none; } }
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBCDCF"/><stop offset=".42" stop-color="#BCBEC0"/><stop offset="1" stop-color="#B2B4B6"/>
    </linearGradient>
    <linearGradient id="g-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62C6EC"/><stop offset=".42" stop-color="#3CB5E5"/><stop offset="1" stop-color="#36A9D8"/>
    </linearGradient>
    <pattern id="hatch-good" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.6" height="6" fill="rgba(0,126,122,.22)"/></pattern>
    <pattern id="hatch-bad" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.6" height="6" fill="rgba(220,38,38,.20)"/></pattern>
    <pattern id="hatch-flat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.6" height="6" fill="rgba(116,118,120,.22)"/></pattern>
  </defs>
</svg>

      <path d="M32.8187 1.31152C28.6427 1.31152 25.9127 5.23711 20.9658 6.58897C22.7404 8.36452 25.1944 9.78319 27.2939 9.78319C30.2962 9.78319 32.2451 8.82566 33.4454 7.20799L36.7805 2.74782C36.7805 2.74782 35.0825 1.31226 32.8187 1.31226" fill="white"/>
      <path d="M45.7822 14.2412H43.9674L41.6055 20.7376C41.4695 21.1136 41.3874 21.3632 41.3874 21.3632H41.36C41.36 21.3632 39.5039 16.6057 38.5487 14.2412H36.6377L39.9946 22.6013C40.1861 23.0881 40.7992 23.8958 42.0012 23.8958L45.7822 14.2419V14.2412Z" fill="white"/>

    </svg>
  </a>
  <h1 class="topnav-brand">VBM Performance Hub</h1>
  <div class="topnav-actions">

      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="2" width="13" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M6 2v12" stroke="currentColor" stroke-width="1.4"/></svg>

</header>

<main class="page">
  <section class="bar" aria-label="Filtros">
    <div class="bar-title">
      <p class="eyebrow">COO · Business Units</p>
      <h2><span id="buName">Sossego</span> <span>·</span> <span id="periodName">Set/26 · Q3 26 · 2026</span></h2>
    </div>
    <div class="filter">
      <span class="filter-label" id="lblBu">Unidade</span>
      <div class="seg" role="group" aria-labelledby="lblBu" data-filter="bu"></div>
    </div>
    <div class="filter">
      <span class="filter-label" id="lblVisao">Visão</span>
      <div class="seg" role="group" aria-labelledby="lblVisao" data-filter="visao"></div>
    </div>
    <div class="filter">
      <span class="filter-label" id="lblAno">Ano</span>
      <div class="seg" role="group" aria-labelledby="lblAno" data-filter="ano"></div>
    </div>
    <div class="filter">
      <span class="filter-label" id="lblTri">Trimestre</span>
      <div class="seg" role="group" aria-labelledby="lblTri" data-filter="tri"></div>
    </div>
    <div class="filter">
      <span class="filter-label" id="lblMes">Mês</span>
      <div class="seg" role="group" aria-labelledby="lblMes" data-filter="mes"></div>
    </div>
    <div class="filter">
      <span class="filter-label" id="lblEscala">Escala</span>
      <div class="seg" role="group" aria-labelledby="lblEscala" data-filter="escala"></div>
    </div>
    <div class="spacer"></div>
    <div class="bar-meta">
      <ul class="legend" aria-label="Legenda">
        <li><span class="swatch" style="background:var(--serie-b)"></span>Budget | Adjusted Budget (B)</li>
        <li><span class="swatch" style="background:var(--serie-a)"></span>Forecast | Actual (F | A)</li>
      </ul>
      <p class="updated"><span class="demo" title="Valores do print COO – Business Units (Sossego, set/2026). Trocar unidade ou período só muda a seleção; na integração, cada troca refaz a consulta de chart-data.">Dados de exemplo</span> Atualizado em 14/10/2026 08:58</p>
    </div>
  </section>

  <div class="dash">
    <section class="panel panel-prod" aria-labelledby="hProd">
      <h3 class="panel-title" id="hProd">Production Drivers</h3>
      <div class="panel-grid" id="gridProd"></div>
    </section>
    <section class="panel panel-fin" aria-labelledby="hFin">
      <h3 class="panel-title" id="hFin">Financial Drivers</h3>
      <div class="panel-grid" id="gridFin"></div>
    </section>
  </div>
</main>

<div class="tip" id="tip" hidden></div>

<script>
(function () {
  'use strict';

  // ── Dados do print (B = Budget; A/F = Actual no mês e no trimestre, Forecast no ano) ──
  // Cada par: [Budget, Actual|Forecast] para [mês, trimestre, ano].
  var INDICADORES = [
    { id: 'mine', sec: 'prod', t: 'Mine Movement', u: 'Mt', dec: 0, pol: 'up', d: [[2, 2], [6, 6], [26, 28]] },
    { id: 'ore', sec: 'prod', t: 'Ore Milled | ROP (Dry)', u: 'Mt', dec: 1, pol: 'up', d: [[0.2, 0.3], [1.5, 1.5], [9.2, 10.1]] },
    { id: 'grade', sec: 'prod', t: 'Copper + Gold Feed Grade', u: '%', dec: 2, pol: 'up', pp: true,
      alt: {
        cu: { lbl: 'Cu', u: '%', d: [[0.89, 0.96], [0.89, 0.84], [0.89, 0.86]] },
        au: { lbl: 'Au', u: 'g/t (a confirmar)', d: [[0.17, 0.22], [0.17, 0.19], [0.21, 0.21]], pp: false }
      } },
    { id: 'curec', sec: 'prod', t: 'Copper Recovery', u: '%', dec: 2, pol: 'up', pp: true, d: [[82.52, 67.52], [89.08, 79.89], [90.60, 87.55]] },
    { id: 'aurec', sec: 'prod', t: 'Gold Recovery', u: '%', dec: 2, pol: 'up', pp: true, d: [[72.28, 67.41], [71.17, 76.31], [76.01, 79.27]] },
    { id: 'cuprod', sec: 'prod', t: 'Copper Production', u: 'kt', dec: 0, pol: 'up', d: [[2, 2], [12, 10], [74, 76]] },
    { id: 'auprod', sec: 'prod', t: 'By Product | Gold', u: 'koz', dec: 0, pol: 'up', d: [[1, 1], [6, 7], [46, 53]] },
    { id: 'cusales', sec: 'prod', t: 'Copper Production | Sales', u: 'kt', dec: 0, pol: 'up', d: [[2, 2], [15, 12], [70, 72]] },
    { id: 'ausales', sec: 'prod', t: 'By Product Gold | Sales', u: 'koz', dec: 0, pol: 'up', d: [[1, 1], [7, 12], [42, 58]] },

    { id: 'rev', sec: 'fin', t: 'Revenues', u: 'US$ M', dec: 0, pol: 'up', d: [[39, 32], [260, 237], [1188, 1296]] },
    { id: 'cogs', sec: 'fin', t: 'COGS', u: 'US$ M', dec: 0, pol: 'down', d: [[30, 19], [117, 90], [455, 473]] },
    { id: 'ebitda', sec: 'fin', t: 'EBITDA', u: 'US$ M', dec: 0, pol: 'up', d: [[6, 10], [134, 138], [696, 782]] },
    { id: 'capex', sec: 'fin', t: 'CAPEX', u: 'US$ M', dec: 0, pol: 'down', d: [[7, 8], [20, 33], [108, 95]] },
    { id: 'scf', sec: 'fin', t: 'Simple Cash Flow', u: 'US$ M', dec: 0, pol: 'up', d: [[-1, 2], [114, 105], [588, 687]] },
    { id: 'allin', sec: 'fin', t: 'All-in', u: 'US$ k/t', dec: 1, pol: 'down', d: [[18.4, 16.4], [7.6, 6.6], [5.6, 4.5]],
      comp: [
        { lbl: 'By Product', v: [0.0, -1.0, -1.8, -4.0, -2.8, -3.7] },
        { lbl: 'Sustaining', v: [3.5, 5.2, 1.3, 2.8, 1.5, 1.3] },
        { lbl: 'Cost', v: [14.9, 12.3, 8.1, 7.8, 6.9, 6.9] }
      ] }
  ];

  // ── Estado dos filtros ──
  var MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  var MESES_LONGOS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  var state = { bu: 'Sossego', visao: 'Plan', ano: 2026, tri: 3, mes: 9, escala: 'periodo', grade: 'cu' };
  var OPTS = {
    bu: function () { return [['Sossego', 'Sossego'], ['Salobo', 'Salobo']]; },
    visao: function () { return [['Plan', 'Plan']]; },
    ano: function () { return [[2025, '2025'], [2026, '2026']]; },
    tri: function () { return [[1, 'Q1'], [2, 'Q2'], [3, 'Q3'], [4, 'Q4']]; },
    mes: function () {
      var first = (state.tri - 1) * 3;
      return [0, 1, 2].map(function (i) { return [first + i + 1, MESES_LONGOS[first + i]]; });
    },
    escala: function () { return [['periodo', 'Por período'], ['unica', 'Única']]; }
  };

  function yy() { return String(state.ano).slice(2); }
  // Rótulos do eixo no padrão do print/Performance Hub: "Set B", "Q3A", "26F"
  function axis() {
    var m = MESES[state.mes - 1], q = 'Q' + state.tri, y = yy();
    return [[m + ' B', m + ' A'], [q + 'B', q + 'A'], [y + 'B', y + 'F']];
  }
  var PER = ['mês', 'trimestre', 'ano'];

  // ── Formatação pt-BR ──
  function fmt(v, dec) {
    return v.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec }).replace('-', '−');
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // Variação de A/F contra B: p.p. para indicadores em %, % relativo nos demais.
  function delta(b, a, ind, pp) {
    var d, txt, flat;
    if (pp) {
      d = a - b;
      flat = Math.abs(d) < 0.05;
      txt = (d > 0 ? '+' : d < 0 ? '−' : '') + fmt(Math.abs(d), Math.abs(d) < 1 ? 2 : 1) + ' p.p.';
    } else {
      if (b === 0) return { txt: 'n/a', cls: 'is-flat', d: 0 };
      d = (a - b) / Math.abs(b);
      flat = Math.abs(d) < 0.005;
      txt = (d > 0 ? '+' : d < 0 ? '−' : '') + fmt(Math.abs(d * 100), 1) + '%';
    }
    var fav = ind.pol === 'down' ? d < 0 : d > 0;
    return { txt: flat ? '0,0' + (pp ? ' p.p.' : '%') : txt, cls: flat ? 'is-flat' : fav ? 'is-good' : 'is-bad', d: d };
  }

  function view(ind) {
    if (!ind.alt) return { d: ind.d, u: ind.u, pp: !!ind.pp, dec: ind.dec };
    var alt = ind.alt[state.grade];
    return { d: alt.d, u: alt.u, pp: alt.pp !== false, dec: ind.dec };
  }

  // ── Gráfico: seis barras (3 pares B × A/F) no tamanho exato do espaço do card ──
  function chartSvg(ind, W, H) {
    var v = view(ind), ax = axis();
    var MT = 44, MB = 18, PW = W / 3;
    var BW = Math.max(14, Math.min(34, PW * 0.3)), GAP = Math.max(10, Math.min(26, PW * 0.2));
    var all = [].concat.apply([], v.d);
    function dom(vals) {
      var lo = Math.min(0, Math.min.apply(null, vals)), hi = Math.max(0, Math.max.apply(null, vals));
      if (hi === lo) hi = lo + 1;
      return [lo, hi];
    }
    var label = [ind.t + ' (' + v.u + ').'];
    var out = '';
    v.d.forEach(function (pair, i) {
      var dm = state.escala === 'unica' ? dom(all) : dom(pair);
      var y = function (val) { return MT + (dm[1] - val) / (dm[1] - dm[0]) * (H - MT - MB); };
      var x0 = i * PW, cx = x0 + PW / 2;
      var xb = cx - GAP / 2 - BW, xa = cx + GAP / 2, y0 = y(0);
      var dl = delta(pair[0], pair[1], ind, v.pp);
      label.push(PER[i] + ': Budget ' + fmt(pair[0], v.dec) + ', ' + (i === 2 ? 'Forecast ' : 'Actual ') + fmt(pair[1], v.dec) + ', variação ' + dl.txt + '.');

      if (i > 0 && state.escala === 'periodo') out += '<line class="b-sep" x1="' + x0 + '" x2="' + x0 + '" y1="' + (MT - 30) + '" y2="' + (H - 2) + '"/>';
      out += '<line class="b-base" x1="' + (x0 + 4) + '" x2="' + (x0 + PW - 4) + '" y1="' + y0 + '" y2="' + y0 + '"/>';

      [[xb, pair[0], 'g-b', ax[i][0], 'Budget'], [xa, pair[1], 'g-a', ax[i][1], i === 2 ? 'Forecast' : 'Actual']].forEach(function (bar) {
        var yv = y(bar[1]), top = Math.min(yv, y0), h = Math.max(Math.abs(yv - y0), 1.5), neg = bar[1] < 0;
        var tip = esc(bar[3] + ' · ' + bar[4] + ': ' + fmt(bar[1], v.dec) + ' ' + v.u);
        out += '<rect class="b-bar' + (neg ? ' neg' : '') + '" x="' + bar[0] + '" y="' + top + '" width="' + BW + '" height="' + h + '" rx="3" fill="url(#' + bar[2] + ')" data-tip="' + tip + '"/>';
        // Negativo: rótulo acima da linha do zero, para não colidir com o eixo
        var ly = neg ? y0 - 5 : yv - 5;
        out += '<text class="b-val" x="' + (bar[0] + BW / 2) + '" y="' + ly + '" text-anchor="middle">' + fmt(bar[1], v.dec) + '</text>';
        out += '<text class="b-axis" x="' + (bar[0] + BW / 2) + '" y="' + (H - 4) + '" text-anchor="middle">' + esc(bar[3]) + '</text>';
      });

      // Cota de diferença: nível B tracejado, nível A sólido, faixa, haste, fio guia e pílula.
      var x1 = xb + BW, x2 = xa, yb = y(pair[0]), ya = y(pair[1]);
      var ytop = Math.min(yb, ya, y0), pillH = 16, pillW = Math.max(36, dl.txt.length * 5.6 + 12);
      var pillY = Math.max(0, ytop - 19 - pillH), up = pair[1] >= pair[0];
      out += '<g class="cota ' + dl.cls + '">';
      out += '<line class="d-ref" x1="' + (x1 - 2) + '" x2="' + (x2 + 2) + '" y1="' + yb + '" y2="' + yb + '"/>';
      out += '<line class="d-now" x1="' + (x1 - 2) + '" x2="' + (x2 + 2) + '" y1="' + ya + '" y2="' + ya + '"/>';
      if (Math.abs(yb - ya) > 0.5) {
        out += '<rect class="' + (up ? 'd-up' : 'd-dn') + '" x="' + x1 + '" y="' + Math.min(yb, ya) + '" width="' + (x2 - x1) + '" height="' + Math.abs(yb - ya) + '"/>';
        out += '<line class="d-span" stroke-width="2" x1="' + cx + '" x2="' + cx + '" y1="' + yb + '" y2="' + ya + '"/>';
      }
      out += '<line class="d-track" x1="' + cx + '" x2="' + cx + '" y1="' + (ytop - 2) + '" y2="' + (pillY + pillH) + '"/>';
      out += '<rect class="d-pill" x="' + (cx - pillW / 2) + '" y="' + pillY + '" width="' + pillW + '" height="' + pillH + '" rx="8"/>';
      out += '<text class="d-txt" x="' + cx + '" y="' + (pillY + 11.5) + '" text-anchor="middle">' + esc(dl.txt) + '</text>';
      out += '</g>';
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label.join(' ')) + '">' + out + '</svg>';
  }

  function compTable(ind) {
    var ax = axis();
    var head = [].concat.apply([], ax).map(function (s) { return '<th scope="col">' + esc(s.replace(' ', '')) + '</th>'; }).join('');
    var rows = ind.comp.map(function (r) {
      return '<tr><td>' + esc(r.lbl) + '</td>' + r.v.map(function (x, i) { return '<td' + (i % 2 === 0 ? ' class="b"' : '') + '>' + fmt(x, 1) + '</td>'; }).join('') + '</tr>';
    }).join('');
    var tot = [0, 1, 2, 3, 4, 5].map(function (i) { return '<td>' + fmt(ind.d[Math.floor(i / 2)][i % 2], 1) + '</td>'; }).join('');
    return '<div class="mini-table-wrap"><table class="mini-table"><caption class="sr-only">Composição do All-in por período</caption>' +
      '<thead><tr><th scope="col">All-in</th>' + head + '</tr></thead><tbody>' + rows + '</tbody>' +
      '<tfoot><tr><td>Total</td>' + tot + '</tr></tfoot></table></div>';
  }

  function cardHtml(ind) {
    var v = view(ind);
    var ctl = '';
    if (ind.alt) {
      ctl = '<div class="seg" role="group" aria-label="Teor exibido">' + Object.keys(ind.alt).map(function (k) {
        return '<button type="button" data-grade="' + k + '" aria-pressed="' + (state.grade === k) + '">' + ind.alt[k].lbl + '</button>';
      }).join('') + '</div>';
    }
    return '<article class="card card-' + ind.id + '" id="card-' + ind.id + '">' +
      '<div class="card-head"><div style="min-width:0"><h4 class="card-title" title="' + esc(ind.t) + '">' + esc(ind.t) + '</h4><p class="card-unit">(' + esc(v.u) + ')</p></div>' + ctl + '</div>' +
      '<div class="chart" data-ind="' + ind.id + '"></div>' +
      (ind.comp ? compTable(ind) : '') +
      '</article>';
  }

  function byId(id) { return INDICADORES.filter(function (i) { return i.id === id; })[0]; }

  function drawChart(el) {
    var W = Math.round(el.clientWidth), H = Math.round(el.clientHeight);
    if (W < 40 || H < 40) return;
    var key = W + 'x' + H + '|' + state.escala + '|' + state.grade + '|' + state.tri + state.mes + state.ano;
    if (el._key === key) return;
    el._key = key;
    el.innerHTML = chartSvg(byId(el.getAttribute('data-ind')), W, H);
  }

  // Redesenha no tamanho real do card (sem distorcer texto); animação só no 1º desenho
  var ro = new ResizeObserver(function (entries) {
    entries.forEach(function (en) { drawChart(en.target); });
  });
  var firstPaint = true;
  function observeCharts() {
    document.querySelectorAll('.chart[data-ind]').forEach(function (el) { ro.observe(el); drawChart(el); });
    if (firstPaint) {
      firstPaint = false;
      setTimeout(function () { document.documentElement.classList.add('is-static'); }, 1600);
    }
  }

  function renderFilters() {
    document.querySelectorAll('[data-filter]').forEach(function (g) {
      var k = g.getAttribute('data-filter');
      g.innerHTML = OPTS[k]().map(function (o) {
        return '<button type="button" data-v="' + o[0] + '" aria-pressed="' + (String(state[k]) === String(o[0])) + '">' + esc(o[1]) + '</button>';
      }).join('');
    });
  }

  function render() {
    document.getElementById('buName').textContent = state.bu;
    document.getElementById('periodName').textContent = MESES[state.mes - 1] + '/' + yy() + ' · Q' + state.tri + ' ' + yy() + ' · ' + state.ano;
    ro.disconnect();
    document.getElementById('gridProd').innerHTML = INDICADORES.filter(function (i) { return i.sec === 'prod'; }).map(cardHtml).join('');
    document.getElementById('gridFin').innerHTML = INDICADORES.filter(function (i) { return i.sec === 'fin'; }).map(cardHtml).join('');
    observeCharts();
  }

  // ── Eventos ──
  document.querySelector('.bar').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-v]');
    if (!btn) return;
    var k = btn.parentElement.getAttribute('data-filter'), raw = btn.getAttribute('data-v');
    state[k] = isNaN(Number(raw)) ? raw : Number(raw);
    if (k === 'tri') state.mes = (state.tri - 1) * 3 + 3; // cascata: último mês do trimestre
    renderFilters();
    render();
  });

  document.addEventListener('click', function (e) {
    var g = e.target.closest('button[data-grade]');
    if (!g) return;
    state.grade = g.getAttribute('data-grade');
    var card = document.getElementById('card-grade');
    var tmp = document.createElement('div');
    tmp.innerHTML = cardHtml(byId('grade'));
    card.replaceWith(tmp.firstChild);
    observeCharts();
    var btn = document.querySelector('#card-grade button[data-grade="' + state.grade + '"]');
    if (btn) btn.focus();
  });

  var tip = document.getElementById('tip');
  document.addEventListener('pointermove', function (e) {
    var t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.hidden = true; return; }
    tip.textContent = t.getAttribute('data-tip');
    tip.hidden = false;
    var x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + 'px';
    tip.style.top = (e.clientY - 34) + 'px';
  });

  document.getElementById('btnTheme').addEventListener('click', function () {
    var root = document.documentElement;
    var cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  });

  // Tela cheia: alterna; navegadores ou janelas que bloqueiam a API ficam com o F11
  document.getElementById('btnFull').addEventListener('click', function () {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
    } catch (e) { /* sem suporte */ }
  });

  renderFilters();
  render();
})();
</script>
</body></html>
